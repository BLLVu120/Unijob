version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: unijob_postgres
    environment:
      POSTGRES_DB: unijob_db
      POSTGRES_USER: unijob_user
      POSTGRES_PASSWORD: unijob_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unijob_user -d unijob_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4
    container_name: unijob_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
volumes:
  postgres_data:
